services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    container_name: gametime-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gametime
      POSTGRES_USER: ${DB_ADMIN_USER:?Set DB_ADMIN_USER in .env}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD in .env}
      GAMETIME_APP_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gametime-postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER} -d gametime"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gametime-postgres-data:
