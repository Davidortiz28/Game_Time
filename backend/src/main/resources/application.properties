spring.application.name=gametime-admin
spring.config.import=optional:file:.env[.properties]
server.address=127.0.0.1
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gametime}
spring.datasource.username=${DB_USER:gametime_app}
spring.datasource.password=${DB_PASSWORD}

spring.thymeleaf.cache=false
