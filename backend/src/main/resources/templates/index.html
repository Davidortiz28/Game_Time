<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GameTime | Administración</title>
    <style>
        :root { color-scheme: dark; font-family: system-ui, sans-serif; }
        body { margin: 0; min-height: 100vh; background: #111827; color: #f9fafb; }
        main { max-width: 760px; margin: 12vh auto; padding: 2rem; }
        .panel { padding: 2rem; border: 1px solid #374151; border-radius: 1rem; background: #1f2937; }
        .tag { color: #a7f3d0; font-size: .85rem; }
        p { color: #d1d5db; line-height: 1.6; }
        form { margin-top: 1.5rem; }
        button { padding: .65rem 1rem; border: 0; border-radius: .5rem; cursor: pointer; }
    </style>
</head>
<body>
<main>
    <div class="panel">
        <div class="tag">PANEL LOCAL · PROTOTIPO</div>
        <h1>GameTime</h1>
        <p>Sesión iniciada como <strong th:text="${adminUsername}">admin</strong>.</p>
        <p>La gestión de juegos y sesiones se añadirá en los siguientes incrementos.</p>
        <p>Backend Spring Boot · Thymeleaf · PostgreSQL + pgvector</p>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">Cerrar sesión</button>
        </form>
    </div>
</main>
</body>
</html>
